

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Casio HS-8VA</title>
 <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="calculator">
    <div class="brand">CASIO <span class="model">HS-8VA</span></div>
    <div class="solar"></div>
    <div class="display" id="display"></div>

    <div class="buttons">
      <!-- Fila 1 -->
      <button class="gray">MRC</button>
      <button class="gray">M-</button>
      <button class="gray">M+</button>
      <button class="operator">÷</button>

      <!-- Fila 2 -->
      <button class="red">ON/C</button>
      <button class="gray">MU</button>
      <button class="gray">%</button>
      <button class="operator">×</button>

      <!-- Fila 3 -->
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">−</button>

      <!-- Fila 4 -->
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">+</button>

      <!-- Fila 5 -->
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">=</button>

      <!-- Fila 6 -->
      <button>0</button>
      <button>.</button>
    </div>
  </div>

</body>
</html>
